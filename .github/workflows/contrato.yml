name: contrato
on: [push, pull_request]
jobs:
  testes:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # versões do uv.lock; pacote instalado sem modo editável, como um consumidor o recebe
      - run: uv sync --locked --extra dev --no-editable --python ${{ matrix.python-version }}
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync mypy
      - run: uv run --no-sync validar-plano src/captura_contrato/exemplo-plano.geojson
