name: contrato
on: [push, pull_request]
jobs:
  testes:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # instala o pacote (não editável), para os testes usarem o que um consumidor recebe
      - run: pip install ".[dev]"
      - run: pytest -q
      - run: mypy
      - run: validar-plano src/captura_contrato/exemplo-plano.geojson
